name: Prepare Folders, Extract ZIPs & Build JSON

on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - 'incoming_zips/**'
      - 'walls/**'
      - 'prepare_folders.py'
      - 'process_wallpapers.py'
      - 'catalog_aliases.py'
  workflow_dispatch:

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for image verification
        run: pip install pillow

      - name: Ensure all deity/category folders have fake.page
        run: python prepare_folders.py

      - name: Extract ZIPs, verify all images, and build wallpapers.json
        run: python process_wallpapers.py

      - name: Commit and push folders, extracted images, and wallpapers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync deity folders with fake.page, extract zips, and update wallpapers.json" || exit 0
          git push
          
